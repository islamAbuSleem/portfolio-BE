name: Keep Render awake

# Render's free tier spins the service down after 15 minutes of inactivity,
# and a cold start takes ~50 seconds. The Cloudflare Worker proxies /api/*
# to this service and a Workers subrequest times out well before that, so the
# first request after a sleep would fail with a 504 Gateway Timeout.
#
# Pinging the health endpoint on a schedule keeps the instance warm, which
# makes the Worker proxy reliable. GitHub Actions are free for public repos.
#
# Caveat: scheduled runs on public runners can be delayed by up to ~15
# minutes when GitHub's scheduler is busy. If you need a hard guarantee, use
# a dedicated uptime pinger instead.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 120 \
            https://portfolio-usca.onrender.com/health
